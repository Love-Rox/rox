name: Build & Push Images

# Build the backend and frontend container images and push them to GHCR.
#
# Tagging:
#   - push to dev    -> :dev    + :sha-<short>   (the tag the K3S deployment tracks via keel)
#   - push to main   -> :main   + :sha-<short>
#   - push tag v*    -> :<version> (e.g. v2026.7.0-rc.1) + :sha-<short>
#
# Note: we intentionally do NOT publish a moving `:latest` tag. The cluster
# tracks the explicit `:dev` tag, and avoiding `:latest` sidesteps the tag
# resolution ambiguity that previously affected keel on the ikaskey instance.

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: love-rox

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: docker/Dockerfile.backend
            image: rox-backend
          - component: frontend
            dockerfile: docker/Dockerfile.frontend
            image: rox-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            ROX_BUILD_SHA=${{ github.sha }}
            ROX_BUILD_CHANNEL=${{ github.ref_name }}
            ROX_BUILD_NUMBER=${{ github.run_number }}
